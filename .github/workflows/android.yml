name: Build TontiDette APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - run: tar -xzf tontidette.tar.gz
    
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - run: chmod +x */gradlew
    
    - run: ./gradlew assembleRelease
      working-directory: tontidette
    
    - uses: actions/upload-artifact@v4
      with:
        name: TontiDette-Release-APK
        path: tontidette/app/build/outputs/apk/release/*.apk
